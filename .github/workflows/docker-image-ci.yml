name: Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 构建 Docker 镜像
        run: |
          docker build . --file Dockerfile --tag lori255/cryp:latest

      - name: 登录 Docker Hub
        if: github.event_name == 'push'
        run: docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

      - name: 推送 Docker 镜像
        if: github.event_name == 'push'
        run: |
          docker push lori255/cryp:latest
